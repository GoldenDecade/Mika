name: Sync Upstream

on:
  schedule:
    # 每天世界标准时间 18:00 = 北京时间凌晨 2:00
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/wangzan101/Mika.git
          git fetch upstream main
          git merge --ff-only upstream/main || (echo "::error::Upstream has diverged, needs manual resolve" && exit 1)
          git push origin main
